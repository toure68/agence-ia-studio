name: Import Agence IA Studio V2.1
on:
  push:
    branches: [main]
    paths:
      - 'Agence_IA_Studio_V2_1.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely unpack application into repository
        run: |
          python - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path('Agence_IA_Studio_V2_1.zip')
          if not archive.exists():
              raise SystemExit('Archive manquante')
          root = pathlib.Path('.').resolve()
          prefix = 'Agence_IA_Studio_V2_1/'
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  if not item.filename.startswith(prefix):
                      raise SystemExit('Chemin inattendu: ' + item.filename)
                  rel = pathlib.PurePosixPath(item.filename[len(prefix):])
                  if not rel.parts or item.is_dir():
                      continue
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit('Chemin interdit: ' + str(rel))
                  if rel.parts[0] in ('__pycache__', '.pytest_cache', 'data', '.venv') or rel.name == '.env':
                      continue
                  dest = (root / str(rel)).resolve()
                  if not dest.is_relative_to(root):
                      raise SystemExit('Écriture hors du dépôt')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(item))
          PY
          rm Agence_IA_Studio_V2_1.zip
      - name: Commit imported source code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Agence IA Studio V2.1 source"
            git push
          fi
