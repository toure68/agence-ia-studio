name: Import Agence IA Studio V2.1
on:
  push:
    branches: [main]
    paths:
      - 'transfer/part07.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, decode and unpack V2.1
        run: |
          python - <<'PY'
          import base64,hashlib,pathlib,zipfile,io
          parts=[pathlib.Path(f'transfer/part{i:02d}.b64').read_text() for i in range(1,8)]
          data=base64.b64decode(''.join(parts),validate=True)
          expected='930ca82c959d833832f18d1e13b73fef6a99811ae116d956472cd3342b787e51'
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('Archive incorrecte; opération annulée')
          root=pathlib.Path('.').resolve()
          prefix='Agence_IA_Studio_V2_1/'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for item in z.infolist():
                  if not item.filename.startswith(prefix):
                      raise SystemExit('Chemin inattendu: '+item.filename)
                  rel=pathlib.PurePosixPath(item.filename[len(prefix):])
                  if item.is_dir() or not rel.parts:
                      continue
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit('Chemin interdit')
                  if rel.parts[0] in ('__pycache__','.pytest_cache','data','.venv') or rel.name=='.env':
                      continue
                  dest=(root/str(rel)).resolve()
                  if not dest.is_relative_to(root):
                      raise SystemExit('Écriture hors du dépôt')
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          PY
          rm -rf transfer
      - name: Commit application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Agence IA Studio V2.1 application"
            git push
          fi
