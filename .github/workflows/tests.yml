name: Application tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng poppler-utils ffmpeg
      - run: python -m pytest -q
      - run: node --check static/list-status.js && node --check static/edge-back.js && node --check static/wallpaper.js && node --check static/admin.js && node --check static/site.js && node --check static/priorities.js && node --check static/business.js && node --check static/office.js && node --check static/voice.js && node --check static/zero.js && node --check static/banks.js && node --check static/workspace.js && node --check static/module-focus.js && node --check static/dark-surfaces.js && node --check static/form-guide.js && node --check static/in-app-files.js && node --check static/signature.js && node --check static/assistant.js && node --check static/ai-budget.js && node --check static/context.js

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      APP_ENV: development
      DATABASE_PATH: /tmp/agence-ui-smoke.db
      ADMIN_EMAIL: ui-owner@example.test
      ADMIN_PASSWORD: local-ui-smoke-test-only
      SESSION_SECRET: local-ui-smoke-secret-for-automated-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng poppler-utils ffmpeg
      - run: npm install --no-save --no-package-lock playwright
      - name: Start isolated test application
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8123 > /tmp/agence-ui-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/agence-ui-server.log
          exit 1
      - run: python tests/document_fixtures.py
      - name: Run node tests/ui_navigation.cjs
        run: |
          set -o pipefail
          if ! node tests/ui_navigation.cjs 2>&1 | tee /tmp/ui-navigation.log; then
            msg=$(tail -c 3000 /tmp/ui-navigation.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=ui_navigation::$msg"
            exit 1
          fi
      - name: Run node tests/grid_proportions.cjs
        run: |
          set -o pipefail
          if ! node tests/grid_proportions.cjs 2>&1 | tee /tmp/grid-proportions.log; then
            msg=$(tail -c 3000 /tmp/grid-proportions.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=grid_proportions::$msg"
            exit 1
          fi
      - name: Run node tests/column_chooser.cjs
        run: |
          set -o pipefail
          if ! node tests/column_chooser.cjs 2>&1 | tee /tmp/column-chooser.log; then
            msg=$(tail -c 3000 /tmp/column-chooser.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=column_chooser::$msg"
            exit 1
          fi
      - name: Run node tests/bank_pills.cjs
        run: |
          set -o pipefail
          if ! node tests/bank_pills.cjs 2>&1 | tee /tmp/bank-pills.log; then
            msg=$(tail -c 3000 /tmp/bank-pills.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=bank_pills::$msg"
            exit 1
          fi
      - name: Run node tests/module_focus.cjs
        run: |
          set -o pipefail
          if ! node tests/module_focus.cjs 2>&1 | tee /tmp/module-focus.log; then
            msg=$(tail -c 3000 /tmp/module-focus.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=module_focus::$msg"
            exit 1
          fi
      - name: Run node tests/demo_treasury.cjs
        run: |
          set -o pipefail
          if ! node tests/demo_treasury.cjs 2>&1 | tee /tmp/demo-treasury.log; then
            msg=$(tail -c 3000 /tmp/demo-treasury.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=demo_treasury::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-ui-checks
          path: |
            /tmp/ui-images
            /tmp/agence-ui-server.log
